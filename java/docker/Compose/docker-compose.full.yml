# ============================================================
# 一键全家桶：MySQL + MongoDB + Redis + MinIO(对象存储) + 后端应用 + Nginx
# 用法：
#   cd java && mvn -DskipTests package
#   cd docker/Compose
#   cp env.full.example .env && vi .env   # 填JWT_SECRET/密码
#   docker compose -f docker-compose.full.yml up -d --build
# 前端：web npm run build 后把 dist 放到 ./nginx/dist（或改下面挂载路径）
# ============================================================
services:
  mysql:
    image: mysql:5.7
    container_name: pigx-mysql
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?请设置数据库密码}
      MYSQL_DATABASE: pigx_admin
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7.0
    container_name: pigx-mongo
    restart: always
    environment:
      TZ: Asia/Shanghai
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?请设置Mongo密码}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0
    container_name: pigx-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?请设置Redis密码}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: pigx-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?请设置S3密钥}
    ports:
      - "9001:9001"   # MinIO控制台
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pigx

  pig4cloud:
    build:
      context: ../../
      dockerfile: docker/Dockerfile/Dockerfile
    image: pig4cloud
    container_name: pig4cloud
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET:?请设置JWT密钥}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      STORE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DB_INIT: ${DB_INIT:-true}
      # 文件存储走S3（MinIO）；STORAGE_TYPE可改local/ftp
      STORAGE_TYPE: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-pigx-admin}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pigx_admin?createDatabaseIfNotExist=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://root:${MONGO_PASSWORD}@mongo:27017/pigx_log?authSource=admin
    networks:
      - pigx

  nginx:
    image: nginx:1.25
    container_name: pigx-nginx
    restart: always
    depends_on:
      - pig4cloud
    ports:
      - "80:80"
    volumes:
      # 前端dist：把 web/dist 拷到本目录的 nginx/dist 下，或修改此路径
      - ./nginx/dist:/usr/share/nginx/html:ro
      - ./nginx/pigx-admin.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pigx

volumes:
  mysql-data:
  mongo-data:
  redis-data:
  minio-data:

networks:
  pigx:
