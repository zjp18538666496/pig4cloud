services:
  pig4cloud:
    build:
      context: ../../  # java目录，Dockerfile从target/读取jar，先执行mvn package
      dockerfile: docker/Dockerfile/Dockerfile
    image: pig4cloud
    container_name: pig4cloud
    ports:
      - "9000:9000"
    environment:
      - TZ=Asia/Shanghai
      # 生产环境必须通过环境变量注入密钥与来源白名单
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    networks:
      - network
networks:
  network:
