server:
  port: 9000
  # 优雅停机：收到SIGTERM后停止接新请求，等在途请求完成再退出（配合K8s/Compose滚动发布请求不掉）
  shutdown: graceful
spring:
  lifecycle:
    # 优雅停机最长等待时间
    timeout-per-shutdown-phase: 30s
  profiles:
    active: dev  # 默认环境
  # 本地敏感配置（数据库/FTP/JWT密钥），不入库，参考 application-local.yaml.example
  config:
    import: optional:classpath:application-local.yaml,optional:file:./application-local.yaml
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  jackson:
    deserialization:
      # DTO字段按需声明，未声明的请求字段忽略而不是报错
      fail-on-unknown-properties: false
  data:
    mongodb:
      # 按@CompoundIndex/@Indexed注解自动建索引
      auto-index-creation: true
    redis:
      # app.store.type=redis时启用；默认本地，生产用环境变量REDIS_HOST/REDIS_PORT/REDIS_PASSWORD
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
s3:
  # app.storage.type=s3时启用；MinIO等自建存储path-style-access=true，公有云S3端点一般为false
  endpoint: ${S3_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${S3_ACCESS_KEY:minioadmin}
  secret-key: ${S3_SECRET_KEY:minioadmin}
  bucket: ${S3_BUCKET:pigx-admin}
  path-style-access: ${S3_PATH_STYLE:true}
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: false
springdoc:
  # 接口文档开关：生产环境设SWAGGER_ENABLED=false关闭，避免接口暴露
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
jwt:
  # 通过环境变量JWT_SECRET或application-local.yaml提供，禁止提交到仓库
  secret: ${JWT_SECRET:}
  expire: 3600000          # 访问令牌1小时
  refresh-expire: 2592000000  # 刷新令牌30天
cors:
  # 允许的来源，多个用逗号分隔；生产环境用环境变量CORS_ORIGINS收紧
  allowed-origins: ${CORS_ORIGINS:*}
app:
  store:
    # 状态存储类型：memory(默认,单机内存) | redis(多实例共享，验证码/在线会话/黑名单等走Redis)
    type: ${STORE_TYPE:redis}
  db-init:
    # 首次启动自动建表+灌入演示数据，生产环境置为false或用环境变量DB_INIT控制
    enabled: ${DB_INIT:true}
  storage:
    # 文件存储类型：local(默认,本地uploadFile目录) | ftp | s3(MinIO/OSS等S3兼容)
    type: ${STORAGE_TYPE:local}
  mail:
    # 找回密码邮件开关：开启需同时在application-local.yaml配置spring.mail.*，否则接口提示未配置
    enabled: ${MAIL_ENABLED:false}
tomcat:
  max-http-form-post-size: -1
logging:
  # 日志规范：策略见logback-spring.xml（控制台+按天/大小滚动zip归档+error单列+非dev异步）
  # 目录默认相对启动目录logs/，生产建议挂载卷；环境变量LOG_HOME/LOG_LEVEL_ROOT覆盖
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
  devtools:
    restart:
      # 日志目录变化不触发devtools热重启
      exclude: logs/**
