name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Backend test (25 unit tests)
        working-directory: java
        run: mvn -B test

      - name: Frontend build
        working-directory: web
        run: |
          npm ci
          npm run build

      # Docker镜像构建（可选：需要时解开并配置仓库凭据）
